name: GHCR Hardened Rebuild

# Rebuilds upstream rustrak/rustrak from a tag with --pull so the
# distroless cc-debian12 base (libssl3 etc.) is fresh, then pushes to
# ghcr.io/philippdormann/rustrak. Fixes trivy HIGH libssl3 CVE-2026-84782
# (3.0.20 -> 3.0.22) without waiting on upstream.
#
# Usage: gh workflow run ghcr-hardened.yml -f upstream_tag=v0.21.1

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to rebuild, e.g. v0.21.1"
        required: true
        default: "v0.21.1"
        type: string
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths:
      - ".github/workflows/ghcr-hardened.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/philippdormann/rustrak

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [sqlite, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rustrak/rustrak
          ref: ${{ inputs.upstream_tag || 'v0.21.1' }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build dashboard into server context
        run: |
          pnpm turbo run build --filter=@rustrak/dashboard
          bash scripts/bundle-dashboard.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (pull fresh base)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: FEATURES=${{ matrix.variant }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.upstream_tag || 'v0.21.1' }}${{ matrix.variant == 'postgres' && '-postgres' || '' }}
            ${{ env.IMAGE }}:${{ matrix.variant == 'postgres' && 'postgres' || 'latest' }}
